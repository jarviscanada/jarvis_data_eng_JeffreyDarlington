# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_JeffreyDarlington/tree/develop/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Designed and built a lightweight cluster monitoring agent for Linux environments. Each node runs a Bash-based script that captures hardware specs and real-time resource metrics — CPU, memory, disk — and ships them to a centralized PostgreSQL database running in Docker. Built the full pipeline: data collection, automation via cron, containerized storage, and SQL-based validation to confirm accuracy."

# List of personal or academic projects
