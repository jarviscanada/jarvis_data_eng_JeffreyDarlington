    #project name
  - name: "StockDataCollectionAnalysis"
    #URL is optional
    git_url: "https://github.com/jeffreydarlington/StockDataCollectionAnalysis/tree/main"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Extracted and visualized select number historical of stocks price and revenue data for Tesla and GameStop using finance and web scraping. Cleaned and structured the datasets with Pandas, then built reusable graphing functions to plot stock trends and quarterly revenue using Matplotlib."

  - name: "VenezuelaOilReservoirs-Fields2026"
    git_url: "https://github.com/jeffreydarlington/VenezuelaOilReservoirs-Fields2026/tree/main"
    description: "Built a data-driven inventory and valuation analysis of Venezuela's upstream oil and gas assets, covering legacy basins and Orinoco Belt developments. Engineered and cleaned raw reserve data, calculated Reserve-to-Production ratios, classified fields by lifecycle status, and surfaced portfolio risks around crude grade and infrastructure. Used Python, Pandas, NumPy, Plotly, and Seaborn to deliver both interactive and static visualizations across basin and asset segments."

